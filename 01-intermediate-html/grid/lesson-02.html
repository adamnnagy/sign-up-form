<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Lesson-02</title>
</head>
<style>
    .container-02 {
        display: inline-grid;
        grid-template: repeat(5, 100px) / repeat(5, 100px);
        background-color: lightblue;
        grid-template-areas: 
        "living-room living-room living-room living-room living-room"
        "living-room living-room living-room living-room living-room"
        "bedroom bedroom bathroom kitchen kitchen"
        "bedroom bedroom bathroom kitchen kitchen"
        "closet closet . . ."
        
        ;
    }

    .room {
        border: 1px solid;
        font-size: 50%;
        text-align: center;
    }

    #living-room {
        {{/*  grid-column-start: 1;
        grid-column-end: 6;  */}}
        {{/*  grid-area: 1 / 1 / 3 / 6;   */}}
        grid-area: living-room;
    }

    #bathroom {
        {{/*  grid-row: 3 / 6;
        grid-column: 1 / 2;  */}}
        grid-area: bathroom;
    }

    #bedroom {
        {{/*  grid-column: 4 / 6;
        grid-row: 2 / 5;  */}}
        grid-area: bedroom;
    }

    #kitchen {
        {{/*  grid-column: 2 / 4;
        grid-row: 2 / 6;  */}}
        grid-area: kitchen;
    }

    #closet {
        {{/*  grid-column: 4 / 6;
        grid-row: 5 / 6;  */}}

        grid-area: closet;
    }




    .container-01 {
    
        display: grid;
        grid-template: repeat(3, 100px) / repeat(3, 100px);

    }
    
    .container-01 > div {
        background: linear-gradient(135deg, gainsboro 0%, aquamarine 100% );
        text-align: center;
    }

</style>
<body>
    <div class="container-02">
        <div class="room" id="living-room">Living Room</div>
        <div class="room" id="kitchen">Kitchen</div>
        <div class="room" id="bedroom">Bedroom</div>
        <div class="room" id="bathroom">Bathroom</div>
        <div class="room" id="closet">Closet</div>
    </div>
    <hr/>
    <div class="container-01">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>
</body>
</html>
